<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-{{CSP_NONCE}}'; style-src 'nonce-{{CSP_NONCE}}'; img-src mdviewerplus-resource:; media-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<style nonce="{{CSP_NONCE}}">
:root {
    --color-bg: #ffffff;
    --color-fg: #24292f;
    --color-border: #d0d7de;
    --color-code-bg: #f6f8fa;
    --color-link: #0969da;
    --color-blockquote-fg: #656d76;
    --color-blockquote-border: #d0d7de;
    --color-hr: #d8dee4;
}

@media (prefers-color-scheme: dark) {
    :root {
        --color-bg: #0d1117;
        --color-fg: #e6edf3;
        --color-border: #30363d;
        --color-code-bg: #161b22;
        --color-link: #58a6ff;
        --color-blockquote-fg: #8b949e;
        --color-blockquote-border: #30363d;
        --color-hr: #21262d;
    }
}

* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--color-fg);
    background-color: var(--color-bg);
    margin: 0;
    padding: 32px 48px;
    word-wrap: break-word;
}

h1, h2, h3, h4, h5, h6 {
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
}

h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--color-border); }
h3 { font-size: 1.25em; }
h4 { font-size: 1em; }

p { margin-top: 0; margin-bottom: 16px; }

a { color: var(--color-link); text-decoration: none; }
a:hover { text-decoration: underline; }

code {
    font-family: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 85%;
    background-color: var(--color-code-bg);
    padding: 0.2em 0.4em;
    border-radius: 6px;
}

pre {
    background-color: var(--color-code-bg);
    border-radius: 6px;
    padding: 16px;
    overflow: auto;
    line-height: 1.45;
}

pre code {
    background: none;
    padding: 0;
    font-size: 85%;
}

blockquote {
    margin: 0 0 16px 0;
    padding: 0 1em;
    color: var(--color-blockquote-fg);
    border-left: 0.25em solid var(--color-blockquote-border);
}

hr {
    height: 0.25em;
    padding: 0;
    margin: 24px 0;
    background-color: var(--color-hr);
    border: 0;
    border-radius: 2px;
}

ul, ol {
    margin-top: 0;
    margin-bottom: 16px;
    padding-left: 2em;
}

li + li { margin-top: 0.25em; }

table {
    border-collapse: collapse;
    border-spacing: 0;
    margin-bottom: 16px;
    width: auto;
    overflow: auto;
}

th, td {
    padding: 6px 13px;
    border: 1px solid var(--color-border);
}

th { font-weight: 600; }

tr:nth-child(2n) { background-color: var(--color-code-bg); }

img { max-width: 100%; height: auto; }

input[type="checkbox"] { margin-right: 0.5em; }

html.print-mode body {
    font-size: 12px;
    line-height: 1.5;
    padding: 24px 36px;
}

html.print-mode h1 { font-size: 1.8em; }
html.print-mode h2 { font-size: 1.4em; }
html.print-mode h3 { font-size: 1.2em; }
html.print-mode pre { font-size: 85%; padding: 12px; }
html.print-mode th, html.print-mode td { padding: 4px 10px; }

@media print {
    :root {
        --color-bg: #ffffff;
        --color-fg: #24292f;
        --color-border: #d0d7de;
        --color-code-bg: #f6f8fa;
        --color-link: #0969da;
        --color-blockquote-fg: #656d76;
        --color-blockquote-border: #d0d7de;
        --color-hr: #d8dee4;
    }
    body {
        background: white;
        color: black;
        padding: 0;
    }
    pre {
        white-space: pre-wrap;
        word-wrap: break-word;
    }
}
</style>
</head>
<body>
<div id="content"></div>
<script nonce="{{CSP_NONCE}}">{{MARKED_JS}}</script>
<script nonce="{{CSP_NONCE}}">{{DOMPURIFY_JS}}</script>
<script nonce="{{CSP_NONCE}}">
    const allowedTags = [
        'a', 'abbr', 'b', 'blockquote', 'br', 'code', 'dd', 'del', 'details',
        'div', 'dl', 'dt', 'em', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'hr',
        'i', 'img', 'input', 'kbd', 'li', 'mark', 'ol', 'p', 'pre', 'q',
        's', 'samp', 'small', 'span', 'strong', 'sub', 'summary', 'sup',
        'table', 'tbody', 'td', 'tfoot', 'th', 'thead', 'time', 'tr', 'ul',
        'var'
    ];
    const allowedAttributes = [
        'alt', 'checked', 'colspan', 'datetime', 'disabled', 'href', 'open',
        'reversed', 'rowspan', 'src', 'start', 'title', 'type'
    ];
    const schemePattern = /^[a-z][a-z0-9+.-]*:/i;

    function isRelativeURL(value) {
        const trimmed = value.trim();
        return trimmed.length > 0
            && !trimmed.startsWith('/')
            && !trimmed.startsWith('//')
            && !trimmed.startsWith('#')
            && !schemePattern.test(trimmed);
    }

    function isSafeLink(value) {
        const trimmed = value.trim();
        return trimmed.startsWith('#')
            || /^(https?:|mailto:)/i.test(trimmed)
            || isRelativeURL(trimmed);
    }

    DOMPurify.addHook('uponSanitizeAttribute', (node, data) => {
        const tagName = node.nodeName.toLowerCase();
        const attributeName = data.attrName.toLowerCase();

        if (tagName === 'a' && attributeName === 'href') {
            data.keepAttr = isSafeLink(data.attrValue);
        } else if (tagName === 'img' && attributeName === 'src') {
            data.keepAttr = isRelativeURL(data.attrValue);
        }
    });

    function normalizeTaskCheckboxes(fragment) {
        for (const input of fragment.querySelectorAll('input')) {
            if ((input.getAttribute('type') || '').toLowerCase() !== 'checkbox') {
                input.remove();
                continue;
            }

            const checked = input.hasAttribute('checked');
            for (const attribute of Array.from(input.attributes)) {
                input.removeAttribute(attribute.name);
            }
            input.setAttribute('type', 'checkbox');
            input.setAttribute('disabled', '');
            if (checked) input.setAttribute('checked', '');
        }
    }

    window.renderMarkdown = function(markdown, printMode = false) {
        document.documentElement.classList.toggle('print-mode', printMode);
        const rawHTML = marked.parse(markdown, { gfm: true });
        const fragment = DOMPurify.sanitize(rawHTML, {
            ALLOWED_TAGS: allowedTags,
            ALLOWED_ATTR: allowedAttributes,
            ALLOW_ARIA_ATTR: false,
            ALLOW_DATA_ATTR: false,
            RETURN_DOM_FRAGMENT: true
        });

        normalizeTaskCheckboxes(fragment);

        const content = document.getElementById('content');
        content.replaceChildren(fragment);

        return {
            resources: Array.from(content.querySelectorAll('img[src]'))
                .map((image) => image.getAttribute('src')),
            height: document.body.scrollHeight
        };
    };

    window.waitForResources = function(timeoutMilliseconds = 3000) {
        const images = Array.from(document.images);
        return Promise.all(images.map((image) => {
            if (image.complete) return Promise.resolve();

            return new Promise((resolve) => {
                const finish = () => resolve();
                image.addEventListener('load', finish, { once: true });
                image.addEventListener('error', finish, { once: true });
                setTimeout(finish, timeoutMilliseconds);
            });
        }));
    };
</script>
</body>
</html>
