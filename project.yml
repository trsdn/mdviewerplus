name: MDViewerPlus
options:
  bundleIdPrefix: com.torstenmahr
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

schemes:
  MDViewerPlus:
    build:
      targets:
        MDViewerPlusFull: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MDViewerPlusFullTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MDViewerPlus-Lite:
    build:
      targets:
        MDViewerPlusLite: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MDViewerPlusLiteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MDViewerPlus-Full:
    build:
      targets:
        MDViewerPlusFull: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MDViewerPlusFullTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MDViewerPlusUITests:
    build:
      targets:
        MDViewerPlusLite: all
    test:
      config: Debug
      targets:
        - MDViewerPlusUITests

targetTemplates:
  AppBase:
    type: application
    platform: macOS
    sources:
      - path: MDViewerPlus
        excludes:
          - Resources
      - path: MDViewerPlus/Resources/AppIcon.icns
        buildPhase: resources
      - path: MDViewerPlus/Resources/Common
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torstenmahr.MDViewerPlus
        PRODUCT_NAME: "MDViewer+"
        PRODUCT_MODULE_NAME: MDViewerPlus
        MARKETING_VERSION: "2.2.1"
        CURRENT_PROJECT_VERSION: "12"
        INFOPLIST_FILE: MDViewerPlus/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: MDViewerPlus/MDViewerPlus.entitlements
          ENABLE_APP_SANDBOX: true
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
          DEAD_CODE_STRIPPING: true
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
          STRIP_SWIFT_SYMBOLS: true
          STRIP_STYLE: "non-global"

  TestBase:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MDViewerPlusTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        PRODUCT_MODULE_NAME: MDViewerPlusTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MDViewer+.app/Contents/MacOS/MDViewer+"
        BUNDLE_LOADER: "$(TEST_HOST)"

targets:
  MDViewerPlusLite:
    templates:
      - AppBase
    sources:
      - path: MDViewerPlus/Resources/Lite
        type: folder
        buildPhase: resources
    settings:
      base:
        MDVIEWER_EDITION: lite
        MDVIEWER_EDITION_DISPLAY: Lite
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MDVIEWER_LITE"

  MDViewerPlusFull:
    templates:
      - AppBase
    sources:
      - path: MDViewerPlus/Resources/Full
        type: folder
        buildPhase: resources
    settings:
      base:
        MDVIEWER_EDITION: full
        MDVIEWER_EDITION_DISPLAY: Full
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MDVIEWER_FULL"

  MDViewerPlusLiteTests:
    templates:
      - TestBase
    dependencies:
      - target: MDViewerPlusLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torstenmahr.MDViewerPlusLiteTests

  MDViewerPlusFullTests:
    templates:
      - TestBase
    dependencies:
      - target: MDViewerPlusFull
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torstenmahr.MDViewerPlusFullTests

  MDViewerPlusUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - MDViewerPlusUITests
    dependencies:
      - target: MDViewerPlusLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torstenmahr.MDViewerPlusUITests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: MDViewerPlusLite
